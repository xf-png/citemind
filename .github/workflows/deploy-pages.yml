name: Deploy CiteMind to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Verify retrieval, research and storage
        run: npm test
      - name: Verify offline package matches source
        run: npm run verify:offline
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile layouts
        run: npm run test:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: qa/browser-results
          retention-days: 7
      - name: Verify bundled model and PDF resources
        run: node tools/verify-assets.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
